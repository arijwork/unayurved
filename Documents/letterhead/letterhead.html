<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Unayurved Letterhead</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Sans:wght@400;500&display=swap">
<style>
  /* Brand tokens: see brand/tokens.css */
  :root {
    --green: #008037; /* sampled from the logo artwork so text matches the mark */
    --text: #1A1A18;
    --text-light: #5C5C52;
    --divider: #C8BFA0;
  }

  @page { size: A4; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #fff; }
  body {
    font-family: 'DM Sans', system-ui, sans-serif;
    color: var(--text);
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  .page {
    width: 210mm;
    height: 297mm;
    position: relative;
    overflow: hidden;
    background: #fff;
  }

  /* ---------- Header ---------- */
  .header {
    position: absolute;
    top: 12mm; left: 18mm; right: 18mm;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
  }
  .logo { width: 40mm; display: block; }

  .contact {
    display: grid;
    grid-template-columns: auto auto;
    column-gap: 3mm;
    align-items: baseline;
    font-size: 9pt;
    line-height: 1.75;
    padding-bottom: 1.5mm;
    font-variant-numeric: tabular-nums;
  }
  .contact .row { display: contents; }
  .contact .label {
    text-align: right;
    font-size: 6.5pt;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--green);
  }
  .contact .value { color: var(--text); letter-spacing: 0.01em; }

  .rule-top {
    position: absolute;
    top: 53mm; left: 18mm; right: 18mm;
    border-top: 0.75pt solid var(--green);
  }
  .rule-top::after {
    content: "";
    position: absolute;
    top: 1.2mm; left: 0; right: 0;
    border-top: 0.4pt solid var(--divider);
  }

  /* ---------- Writing area guide (screen only) ---------- */
  .body-area {
    position: absolute;
    top: 64mm; left: 22mm; right: 22mm; bottom: 34mm;
  }

  /* ---------- Footer ---------- */
  .footer {
    position: absolute;
    left: 18mm; right: 18mm; bottom: 12mm;
    text-align: center;
  }
  .footer .rule {
    border-top: 0.4pt solid var(--divider);
    margin-bottom: 3.2mm;
  }
  .footer .address {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 600;
    font-size: 11pt;
    letter-spacing: 0.02em;
    font-variant-numeric: lining-nums;
    color: var(--green);
    margin-bottom: 1.6mm;
  }
  .footer .reg {
    font-size: 7pt;
    letter-spacing: 0.08em;
    color: var(--text-light);
  }
  .footer .reg b { font-weight: 500; color: var(--text); letter-spacing: 0.1em; }
  .footer .dot { color: var(--divider); margin: 0 2.5mm; }

  /* Screen preview: show the sheet on a grey desk */
  @media screen {
    html, body { background: #e9e7e0; }
    body { padding: 10mm 0; }
    .page { margin: 0 auto; box-shadow: 0 2px 18px rgba(0,0,0,.12); }
  }
  @media screen and (max-width: 820px) {
    body { padding: 16px; overflow-x: auto; }
  }
</style>
</head>
<body>
  <div class="page">
    <header class="header">
      <img class="logo" src="logo.png" alt="Unayurved — Unani | Ayurvedic">
      <div class="contact">
        <div class="row"><span class="label">Mobile</span><span class="value">+91 99906 91112</span></div>
        <div class="row"><span class="label">Alt.</span><span class="value">+91 78385 30159</span></div>
        <div class="row"><span class="label">Email</span><span class="value">unayurved@gmail.com</span></div>
      </div>
    </header>
    <div class="rule-top"></div>

    <main class="body-area"></main>

    <footer class="footer">
      <div class="rule"></div>
      <div class="address">218, Gali No. 2, Zakir Nagar, New Delhi – 110025</div>
      <div class="reg">
        GSTIN&nbsp; <b>07CLJPR0408M2ZS</b>
        <span class="dot">•</span>
        UDYAM&nbsp; <b>UDYAM-DL-09-0055497</b>
      </div>
    </footer>
  </div>
</body>
</html>
